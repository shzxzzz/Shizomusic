name: ShizoMusic
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ShizoMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Domain
      - path: Sources/Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shizomusic.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_CFBundleDisplayName: ShizoMusic
    scheme:
      testTargets: [ShizoMusicTests]
  ShizoMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [target: ShizoMusic]
