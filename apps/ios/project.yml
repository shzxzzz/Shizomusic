name: ShizoMusic
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.8.0
targets:
  ShizoMusic:
    type: application
    platform: iOS
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: ShizoMusic
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: ShizoMusic uses your local network to connect to your private music server.
    sources:
      - path: Sources/App
      - path: Sources/Domain
      - path: Sources/Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shizomusic.app
    dependencies:
      - package: GRDB
    scheme:
      testTargets: [ShizoMusicTests]
  ShizoMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [target: ShizoMusic]
